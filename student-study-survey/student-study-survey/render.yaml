services:
  - type: web
    name: student-study-survey
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ADMIN_PASSCODE
        value: Kushpa45
      - key: SECRET_KEY
        generateValue: true
